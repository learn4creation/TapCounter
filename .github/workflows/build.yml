name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Unzip project
        run: |
          ls -la
          unzip -o -q TapCounter.zip
          ls -R TapCounter | head -40
      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          cd TapCounter
          ../gradle-8.7/bin/gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TapCounter-apk
          path: TapCounter/app/build/outputs/apk/debug/app-debug.apk
